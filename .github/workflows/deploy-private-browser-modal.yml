name: Deploy isolated Chromium browser to Modal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-browser:
    if: github.ref == 'refs/heads/feat/navegador-proprio-chromium'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate Python source
        run: python -m compileall -q browser-service
      - name: Install Modal
        run: python -m pip install modal==1.3.5
      - name: Require deploy credentials
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          test -n "$MODAL_TOKEN_ID" && test -n "$MODAL_TOKEN_SECRET" || {
            echo "::error::Modal GitHub Actions credentials are missing"
            exit 1
          }
      - name: Deploy private browser (requires Modal secret mv-private-browser-control)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy browser-service/modal_app.py
