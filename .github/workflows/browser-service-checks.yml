name: Validate private Chromium browser service
on:
  workflow_dispatch:
  push:
    branches: [feat/navegador-proprio-chromium]
    paths: ['browser-service/**', '.github/workflows/browser-service-checks.yml']
  pull_request:
    paths: ['browser-service/**', '.github/workflows/browser-service-checks.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned Python dependencies
        run: python -m pip install -r browser-service/requirements.txt
      - name: Compile Python
        run: python -m compileall -q browser-service
      - name: Run private API security tests
        run: python -m unittest discover -s browser-service/tests -v
      - name: Validate Docker build
        run: docker build -t mv-private-browser:ci browser-service
