project_id = "meu-vendedor"

[auth]
enabled = true
site_url = "https://meu-vendedor.httpsgithubcomwarllemedicaosunshine-budget-guidegit.workers.dev"
additional_redirect_urls = ["https://meu-vendedor.httpsgithubcomwarllemedicaosunshine-budget-guidegit.workers.dev/entrar", "https://meu-vendedor.httpsgithubcomwarllemedicaosunshine-budget-guidegit.workers.dev/redefinir-senha", "http://localhost:3000/entrar", "http://localhost:3000/redefinir-senha"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true

[functions.marketplace]
# A função verifica o JWT com Supabase Auth em toda chamada de usuário.
# O cron utiliza um segredo próprio validado no handler, nunca a chave pública.
verify_jwt = false

[functions.catalog]
# Somente chamadas de usuário; também valida a sessão explicitamente com Auth no handler.
verify_jwt = true

[functions.catalog-public]
# A vitrine é pública por definição. Não lê sessões, credenciais ou tabelas pessoais.
verify_jwt = false

[functions.video-generation]
# A função continua validando a sessão no handler. A geração real exige também
# GEMINI_API_KEY e MV_GEMINI_SCRIPT_ENABLED=true para roteiros.
verify_jwt = true

[functions.video-generation-worker]
# O worker valida MV_VIDEO_WORKER_SECRET em todas as chamadas.
verify_jwt = false

[functions.audio-generation]
# Validação de JWT com auth.getUser no handler, compatível com chaves públicas novas.
verify_jwt = false

[functions.youtube-connection]
# POSTs verificam a sessão Auth; GET de retorno verifica state, cookie, PKCE e identidade Google.
verify_jwt = false

[functions.kaggle-pilot]
# Piloto administrativo: exige MV_VIDEO_WORKER_SECRET em todas as chamadas.
verify_jwt = false

[functions.motion-generation]
# User operations validate JWT via auth.getUser; executor callbacks use one-job capabilities.
verify_jwt = false

[functions.product-gallery]
# JWT verificado com auth.getUser antes de consultar o produto da própria conta.
verify_jwt = false
