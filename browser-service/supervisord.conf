[supervisord]
nodaemon=true
user=browser

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24
autorestart=true
priority=10

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":99"
autorestart=true
priority=20

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -localhost -rfbport 5900 -nopw
autorestart=true
priority=30

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 127.0.0.1:6080 127.0.0.1:5900
autorestart=true
priority=40

[program:api]
command=/usr/local/bin/uvicorn app:app --host 0.0.0.0 --port 7860
directory=/app
environment=DISPLAY=":99"
autorestart=true
priority=50
